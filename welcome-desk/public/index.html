<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coffee Rush</title>
<style>
  :root{
    --crema:#E0A458; --ink:#17110d; --card:#231912;
    --edge:#3b2a1f; --dim:#b8a493; --ok:#3ddc97; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(1000px 500px at 50% -10%, #3a2414 0%, transparent 60%), var(--ink);
    color:#f6eee6; font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:3vh 4vw;
  }
  h1{font-size:clamp(30px,4.6vw,58px); margin:0; letter-spacing:-.02em; text-align:center}
  h1 span{color:var(--crema)}
  .sub{color:var(--dim); margin:.4rem 0 0; letter-spacing:.22em; text-transform:uppercase; font-size:12px}
  .ns{margin:1.4rem 0 .2rem; font-size:14px; color:var(--dim)}
  .ns code{color:var(--crema); background:var(--card); border:1px solid var(--edge); border-radius:6px; padding:2px 8px}
  .bar{display:flex; gap:14px; align-items:center; margin:1.4rem 0 1rem; flex-wrap:wrap; justify-content:center}
  button{
    font:inherit; font-weight:700; border:0; border-radius:999px; padding:14px 26px;
    cursor:pointer; background:var(--crema); color:#1b120c; letter-spacing:.01em;
    transition:transform .12s ease, filter .12s ease;
  }
  button:hover{transform:translateY(-2px); filter:brightness(1.08)}
  button.calm{background:var(--card); color:var(--dim); border:1px solid var(--edge)}
  .stat{
    display:flex; gap:28px; background:var(--card); border:1px solid var(--edge);
    border-radius:14px; padding:14px 26px; font-variant-numeric:tabular-nums;
  }
  .stat div{text-align:center}
  .stat b{display:block; font-size:26px; line-height:1.1}
  .stat small{color:var(--dim); font-size:11px; letter-spacing:.14em; text-transform:uppercase}
  .slow{color:var(--bad)} .fast{color:var(--ok)}
  .cups{
    display:grid; gap:10px; margin-top:1.6rem; width:min(1100px,100%);
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  }
  .cup{
    background:var(--card); border:1px solid var(--edge); border-left:3px solid var(--crema);
    border-radius:10px; padding:11px 14px; animation:pop .25s ease both;
  }
  .cup .d{font-size:17px; font-weight:700}
  .cup .t{color:var(--dim); font-size:12px; letter-spacing:.1em}
  .cup .m{color:var(--crema); font-size:12px; margin-top:3px}
  @keyframes pop{from{opacity:0; transform:translateY(6px)}to{opacity:1}}
  footer{margin-top:auto; padding-top:2rem; color:var(--dim); font-size:12px; letter-spacing:.1em}
</style>
</head>
<body>
  <h1>Coffee <span>Rush</span></h1>
  <p class="sub">welcome-desk (Node) &nbsp;→&nbsp; coffee-bar (Python)</p>
  <p class="ns">Your telemetry: <code id="ns">service.namespace = …</code></p>

  <div class="bar">
    <button id="rush">☕ Rush hour: the whole queue orders</button>
    <button id="calm" class="calm">Back to one order</button>
  </div>

  <div class="stat">
    <div><b id="lat">–</b><small>Latency</small></div>
    <div><b id="queue">–</b><small>Queue length</small></div>
    <div><b id="served">0</b><small>Drinks served</small></div>
  </div>

  <div class="cups" id="cups"></div>
  <footer>traces → Tempo &nbsp;//&nbsp; metrics → Mimir &nbsp;//&nbsp; logs → Loki</footer>

<script>
let served = 0;

async function poll(){
  const t0 = performance.now();
  try{
    const r = await fetch('/api/orders');
    const d = await r.json();
    const ms = Math.round(performance.now() - t0);

    const lat = document.getElementById('lat');
    lat.textContent = ms + ' ms';
    lat.className = ms > 800 ? 'slow' : 'fast';

    document.getElementById('ns').textContent = 'service.namespace = ' + (d.namespace || '?');
    document.getElementById('queue').textContent = d.queueLength;
    served += (d.drinks || []).length;
    document.getElementById('served').textContent = served;

    document.getElementById('cups').innerHTML = (d.drinks || []).slice(0, 24).map(c =>
      `<div class="cup"><div class="t">${c.ticket}</div>
       <div class="d">${c.drink}</div>
       <div class="m">${c.milk === 'none' ? 'no milk' : c.milk + ' milk'}</div></div>`).join('');
  }catch(e){
    const lat = document.getElementById('lat');
    lat.textContent = 'error'; lat.className = 'slow';
  }
}

async function toggle(on){
  const r = await fetch('/api/rush', {method:'POST'});
  const d = await r.json();
  if (d.rushMode !== on) await fetch('/api/rush', {method:'POST'});
  poll();
}

document.getElementById('rush').onclick = () => toggle(true);
document.getElementById('calm').onclick = () => toggle(false);

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
